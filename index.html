<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculateur Auto-Entrepreneur</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-body: #0f172a; /* Slate 900 */
            --bg-card: #1e293b; /* Slate 800 */
            --bg-input: #0f172a;
            --border-color: #334155; /* Slate 700 */
            --primary: #6366f1; /* Indigo 500 */
            --accent: #10b981; /* Emerald 500 */
            --text-main: #f1f5f9; /* Slate 100 */
            --text-muted: #94a3b8; /* Slate 400 */
            --radius: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 70%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .dashboard {
            width: 100%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 24px;
        }

        /* --- Panel Styles --- */
        .panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: var(--radius);
            padding: 32px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .panel-header {
            margin-bottom: 30px;
        }

        h1 {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: -0.5px;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .subtitle {
            font-size: 13px;
            color: var(--text-muted);
        }

        /* --- Inputs --- */
        .control-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper input {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px 16px;
            border-radius: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 16px;
            transition: all 0.2s ease;
        }

        .input-wrapper input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        .currency-symbol {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
        }

        /* --- Toggles --- */
        .toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding: 12px;
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
            cursor: pointer;
        }

        .toggle-label {
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }

        /* Custom Switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            transition: .3s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 3px;
            bottom: 3px;
            background-color: var(--text-muted);
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--primary);
            border-color: var(--primary);
        }

        input:checked + .slider:before {
            transform: translateX(20px);
            background-color: white;
        }

        /* --- Output Section --- */
        .results-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .result-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 20px;
        }

        .result-card.full-width {
            grid-column: span 2;
            background: linear-gradient(145deg, rgba(99, 102, 241, 0.1) 0%, rgba(15, 23, 42, 0.2) 100%);
            border: 1px solid rgba(99, 102, 241, 0.2);
        }

        .stat-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            margin-bottom: 8px;
            display: block;
        }

        .stat-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 24px;
            font-weight: 700;
            color: var(--text-main);
            display: block;
        }

        .stat-value.total {
            font-size: 36px;
            color: var(--accent);
            text-shadow: 0 0 20px rgba(16, 185, 129, 0.2);
        }

        .breakdown-list {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        .breakdown-item {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-bottom: 8px;
            color: var(--text-muted);
        }

        .breakdown-item span:last-child {
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-main);
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }

        /* Responsive */
        @media (max-width: 900px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
            .results-grid {
                grid-template-columns: 1fr;
            }
            .result-card.full-width {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>

<div class="dashboard">
    <div class="panel">
        <div class="panel-header">
            <h1>💼 Calculateur</h1>
            <p class="subtitle">Auto-Entrepreneur</p>
        </div>

        <div class="control-group">
            <label>Chiffre d'affaires mensuel</label>
            <div class="input-wrapper">
                <input type="number" id="ca" value="0" min="0" step="0.01">
                <span class="currency-symbol">€</span>
            </div>
        </div>

        <div class="control-group">
            <label>Taux d'imposition</label>
            <div class="input-wrapper">
                <input type="number" id="impots" value="12" step="0.01">
                <span class="currency-symbol">%</span>
            </div>
        </div>

        <div class="control-group">
            <label>Taux URSSAF brut</label>
            <div class="input-wrapper">
                <input type="number" id="urssaf" value="24.6" step="0.01">
                <span class="currency-symbol">%</span>
            </div>
        </div>

        <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 20px 0;">

        <label class="toggle-row">
            <span class="toggle-label">✨ ACRE (réduction 50%)</span>
            <div class="switch">
                <input type="checkbox" id="acre" checked>
                <span class="slider"></span>
            </div>
        </label>

        <label class="toggle-row">
            <span class="toggle-label">💼 Je perçois l'ARE (chômage)</span>
            <div class="switch">
                <input type="checkbox" id="are">
                <span class="slider"></span>
            </div>
        </label>

        <div id="allocationGroup" class="control-group fade-in" style="display: none;">
            <label>Allocation journalière ARE</label>
            <div class="input-wrapper">
                <input type="number" id="allocation" value="73.27" step="0.01">
                <span class="currency-symbol">€</span>
            </div>
        </div>
    </div>

    <div class="panel">
        <div class="panel-header">
            <h1>Résultats</h1>
            <p class="subtitle">Analyse détaillée</p>
        </div>

        <div class="results-grid" id="resultsContainer">
        </div>
    </div>
</div>

<script>
    // Fonction formatage monnaie
    const formatMoney = (amount) => {
        return new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR' }).format(amount);
    };

    const caInput = document.getElementById('ca');
    const impotsInput = document.getElementById('impots');
    const urssafInput = document.getElementById('urssaf');
    const acreCheckbox = document.getElementById('acre');
    const areCheckbox = document.getElementById('are');
    const allocationInput = document.getElementById('allocation');
    const allocationGroup = document.getElementById('allocationGroup');
    const resultsContainer = document.getElementById('resultsContainer');

    areCheckbox.addEventListener('change', () => {
        if (areCheckbox.checked) {
            allocationGroup.style.display = 'block';
        } else {
            allocationGroup.style.display = 'none';
        }
        calculer();
    });

    [caInput, impotsInput, urssafInput, acreCheckbox, areCheckbox, allocationInput].forEach(el => {
        el.addEventListener('input', calculer);
        el.addEventListener('change', calculer);
    });

    function calculer() {
        // Récupération des valeurs (IDENTIQUES AU FICHIER ORIGINAL)
        const caMensuel = parseFloat(caInput.value) || 0;
        const tauxImpots = parseFloat(impotsInput.value) || 0;
        const tauxURSSAFBrut = parseFloat(urssafInput.value) || 0;
        const hasAcre = acreCheckbox.checked;
        const percoitARE = areCheckbox.checked;
        const monAllocation = parseFloat(allocationInput.value) || 0;

        // Logique de calcul (IDENTIQUE AU FICHIER ORIGINAL)
        const tauxURSSAF = hasAcre ? (tauxURSSAFBrut / 100 / 2) : (tauxURSSAFBrut / 100);
        const contributionFormation = caMensuel * 0.002;
        const urssafPur = caMensuel * tauxURSSAF;
        const cotisationsURSSAF = urssafPur + contributionFormation;

        const baseImposable = caMensuel * (1 - 0.34);
        const impotsMicro = baseImposable * (tauxImpots / 100);
        const netMicro = caMensuel - cotisationsURSSAF - impotsMicro;

        let areBrute = 0;
        let revenuFranceTravail = 0;
        let are = 0;
        let impotsARE = 0;
        let areApresImpots = 0;

        if (percoitARE) {
            areBrute = monAllocation * 30;
            revenuFranceTravail = caMensuel * 0.7;
            are = Math.max(0, areBrute - revenuFranceTravail);
            impotsARE = are * (tauxImpots / 100);
            areApresImpots = are - impotsARE;
        }

        const revenuTotal = netMicro + areApresImpots;
        const impotsTotaux = impotsMicro + impotsARE;

        // Génération HTML Dashboard
        let html = `
                <div class="result-card">
                    <span class="stat-label">Microentreprise (Net)</span>
                    <span class="stat-value">${formatMoney(netMicro)}</span>
                    <div class="breakdown-list">
                        <div class="breakdown-item">
                            <span>Chiffre d'Affaires</span>
                            <span>${formatMoney(caMensuel)}</span>
                        </div>
                        <div class="breakdown-item">
                            <span>URSSAF (${(tauxURSSAF*100).toFixed(2)}%)</span>
                            <span style="color: #f43f5e">-${formatMoney(urssafPur)}</span>
                        </div>
                        <div class="breakdown-item">
                            <span>Formation</span>
                            <span style="color: #f43f5e">-${formatMoney(contributionFormation)}</span>
                        </div>
                         <div class="breakdown-item">
                            <span>Impôts (sur base 66%)</span>
                            <span style="color: #f43f5e">-${formatMoney(impotsMicro)}</span>
                        </div>
                    </div>
                </div>
            `;

        if (percoitARE) {
            html += `
                <div class="result-card">
                    <span class="stat-label">ARE (Pôle Emploi)</span>
                    <span class="stat-value">${formatMoney(areApresImpots)}</span>
                    <div class="breakdown-list">
                        <div class="breakdown-item">
                            <span>ARE Brute (30j)</span>
                            <span>${formatMoney(areBrute)}</span>
                        </div>
                        <div class="breakdown-item">
                            <span>Déduction (70% CA)</span>
                            <span style="color: #f43f5e">-${formatMoney(revenuFranceTravail)}</span>
                        </div>
                        <div class="breakdown-item">
                            <span>Impôts estimés</span>
                            <span style="color: #f43f5e">-${formatMoney(impotsARE)}</span>
                        </div>
                    </div>
                </div>
                `;
        } else {
            html += `
                <div class="result-card" style="display:flex; align-items:center; justify-content:center; opacity:0.3;">
                    <span class="stat-label">ARE non activée</span>
                </div>
                `;
        }

        html += `
                <div class="result-card full-width">
                    <span class="stat-label">Revenu Net Mensuel Total</span>
                    <span class="stat-value total">${formatMoney(revenuTotal)}</span>
                    <div class="breakdown-list" style="border-top-color: rgba(99, 102, 241, 0.2);">
                        <div class="breakdown-item">
                            <span style="color: var(--primary);">Total des impôts payés : ${formatMoney(impotsTotaux)}</span>
                        </div>
                    </div>
                </div>
            `;

        resultsContainer.innerHTML = html;
    }

    // Init
    calculer();
</script>
</body>
</html>
