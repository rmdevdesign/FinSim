<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculateur Auto-Entrepreneur</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-body: #0f172a;
            --bg-panel: rgba(30, 41, 59, 0.6);
            --bg-input: #1e293b;
            --border-color: #334155;
            --primary: #6366f1;
            --success: #10b981;
            --danger: #f43f5e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --radius: 20px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 80%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .dashboard {
            width: 100%;
            max-width: 900px;
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 24px;
            align-items: start;
        }

        /* --- Panel Gauche (Inputs) --- */
        .panel-config {
            background: var(--bg-panel);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: var(--radius);
            padding: 24px;
        }

        .panel-header {
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .panel-header h1 { font-size: 16px; font-weight: 600; color: var(--text-main); }

        .control-group { margin-bottom: 20px; }

        label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .input-wrapper { position: relative; }

        input[type="number"] {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 12px;
            border-radius: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            transition: 0.2s;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
        }

        .currency {
            position: absolute;
            right: 12px; top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 12px;
        }

        .toggle-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            cursor: pointer;
        }

        .toggle-text { font-size: 13px; font-weight: 500; }

        /* Switch CSS */
        .switch { position: relative; width: 36px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; inset: 0;
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            transition: .3s;
        }
        .slider:before {
            position: absolute; content: "";
            height: 14px; width: 14px;
            left: 2px; bottom: 2px;
            background-color: var(--text-muted);
            border-radius: 50%;
            transition: .3s;
        }
        input:checked + .slider { background-color: var(--primary); border-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(16px); background-color: white; }

        /* --- Panel Droite (Single Result) --- */
        .result-card {
            background: linear-gradient(180deg, rgba(30, 41, 59, 0.7) 0%, rgba(15, 23, 42, 0.8) 100%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: 0 20px 40px -10px rgba(0,0,0,0.3);
        }

        /* Hero Section */
        .result-hero {
            padding: 40px 32px;
            text-align: center;
            background: radial-gradient(circle at top, rgba(99, 102, 241, 0.15), transparent 70%);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .hero-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .hero-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 56px;
            font-weight: 700;
            color: var(--success);
            text-shadow: 0 0 40px rgba(16, 185, 129, 0.2);
            line-height: 1;
        }

        .hero-sub {
            margin-top: 10px;
            font-size: 14px;
            color: var(--text-muted);
            opacity: 0.7;
        }

        /* Details List */
        .result-details {
            padding: 32px;
        }

        .detail-group { margin-bottom: 24px; }
        .detail-group:last-child { margin-bottom: 0; }

        .group-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .line-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 14px;
            color: var(--text-muted);
        }

        .line-item.total-line {
            color: var(--text-main);
            font-weight: 600;
            padding-top: 12px;
            margin-top: 12px;
            border-top: 1px dashed rgba(255,255,255,0.1);
        }

        .mono {
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-main);
        }

        .val-pos { color: var(--text-main); }
        .val-neg { color: var(--danger); }
        .val-total { color: var(--success); }

        @media (max-width: 800px) {
            .dashboard { grid-template-columns: 1fr; }
            .hero-value { font-size: 42px; }
        }
    </style>
</head>
<body>

<div class="dashboard">
    <div class="panel-config">
        <div class="panel-header">
            <h1>⚙️ Paramètres</h1>
        </div>

        <div class="control-group">
            <label>CA Mensuel HT</label>
            <div class="input-wrapper">
                <input type="number" id="ca" value="0" min="0" step="1">
                <span class="currency">€</span>
            </div>
        </div>

        <div class="control-group">
            <label>Taux Impôts</label>
            <div class="input-wrapper">
                <input type="number" id="impots" value="12" step="0.1">
                <span class="currency">%</span>
            </div>
        </div>

        <div class="control-group">
            <label>Taux URSSAF</label>
            <div class="input-wrapper">
                <input type="number" id="urssaf" value="24.6" step="0.1">
                <span class="currency">%</span>
            </div>
        </div>

        <div style="height: 1px; background: var(--border-color); margin: 24px 0;"></div>

        <label class="toggle-row">
            <span class="toggle-text">ACRE (-50%)</span>
            <div class="switch">
                <input type="checkbox" id="acre" checked>
                <span class="slider"></span>
            </div>
        </label>

        <label class="toggle-row">
            <span class="toggle-text">Complément ARE</span>
            <div class="switch">
                <input type="checkbox" id="are">
                <span class="slider"></span>
            </div>
        </label>

        <div id="allocationGroup" class="control-group" style="display: none; margin-top: 20px;">
            <label>Allocation Journalière</label>
            <div class="input-wrapper">
                <input type="number" id="allocation" value="73.27" step="0.01">
                <span class="currency">€</span>
            </div>
        </div>
    </div>

    <div id="resultContainer"></div>
</div>

<script>
    const formatMoney = (amount) => {
        // Affichage avec 2 décimales forcées
        return new Intl.NumberFormat('fr-FR', {
            style: 'currency',
            currency: 'EUR',
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        }).format(amount);
    };

    const caInput = document.getElementById('ca');
    const impotsInput = document.getElementById('impots');
    const urssafInput = document.getElementById('urssaf');
    const acreCheckbox = document.getElementById('acre');
    const areCheckbox = document.getElementById('are');
    const allocationInput = document.getElementById('allocation');
    const allocationGroup = document.getElementById('allocationGroup');
    const resultContainer = document.getElementById('resultContainer');

    areCheckbox.addEventListener('change', () => {
        allocationGroup.style.display = areCheckbox.checked ? 'block' : 'none';
        calculer();
    });

    [caInput, impotsInput, urssafInput, acreCheckbox, areCheckbox, allocationInput].forEach(el => {
        el.addEventListener('input', calculer);
        el.addEventListener('change', calculer);
    });

    function calculer() {
        const caMensuel = parseFloat(caInput.value) || 0;
        const tauxImpots = parseFloat(impotsInput.value) || 0;
        const tauxURSSAFBrut = parseFloat(urssafInput.value) || 0;
        const hasAcre = acreCheckbox.checked;
        const percoitARE = areCheckbox.checked;
        const monAllocation = parseFloat(allocationInput.value) || 0;

        const tauxURSSAF = hasAcre ? (tauxURSSAFBrut / 100 / 2) : (tauxURSSAFBrut / 100);
        const contributionFormation = caMensuel * 0.002;
        const urssafPur = caMensuel * tauxURSSAF;
        const cotisationsURSSAF = urssafPur + contributionFormation;

        const baseImposable = caMensuel * (1 - 0.34);
        const impotsMicro = baseImposable * (tauxImpots / 100);
        const netMicro = caMensuel - cotisationsURSSAF - impotsMicro;

        let areBrute = 0;
        let revenuFranceTravail = 0;
        let arePercue = 0;
        let impotsARE = 0;
        let areNette = 0;

        if (percoitARE) {
            areBrute = monAllocation * 30;
            revenuFranceTravail = caMensuel * 0.7;
            arePercue = Math.max(0, areBrute - revenuFranceTravail);
            impotsARE = arePercue * (tauxImpots / 100);
            areNette = arePercue - impotsARE;
        }

        const totalSuperNet = netMicro + areNette;

        // Construction du HTML dynamique
        let detailsHTML = `
                <div class="result-card">
                    <div class="result-hero">
                        <div class="hero-label">Net Total dans votre poche</div>
                        <div class="hero-value">${formatMoney(totalSuperNet)}</div>
                        <div class="hero-sub">Après paiement de toutes les charges et impôts</div>
                    </div>
                    
                    <div class="result-details">
                        <div class="detail-group">
                            <div class="group-title">Activité Freelance</div>
                            <div class="line-item">
                                <span>Chiffre d'Affaires</span>
                                <span class="mono val-pos">+ ${formatMoney(caMensuel)}</span>
                            </div>
                            <div class="line-item">
                                <span>URSSAF & Formation</span>
                                <span class="mono val-neg">- ${formatMoney(cotisationsURSSAF)}</span>
                            </div>
                            <div class="line-item">
                                <span>Impôts (Versement Lib.)</span>
                                <span class="mono val-neg">- ${formatMoney(impotsMicro)}</span>
                            </div>
                            <div class="line-item total-line">
                                <span>Net Freelance</span>
                                <span class="mono">${formatMoney(netMicro)}</span>
                            </div>
                        </div>
            `;

        // Ajout Bloc ARE si actif
        if (percoitARE) {
            detailsHTML += `
                        <div class="detail-group" style="margin-top: 30px;">
                            <div class="group-title">Complément Pôle Emploi</div>
                            <div class="line-item">
                                <span>Droits ARE (30 jours)</span>
                                <span class="mono val-pos">+ ${formatMoney(areBrute)}</span>
                            </div>
                            <div class="line-item">
                                <span>Déduction Revenus (70% CA)</span>
                                <span class="mono val-neg">- ${formatMoney(revenuFranceTravail)}</span>
                            </div>
                             <div class="line-item">
                                <span>Impôts estimés</span>
                                <span class="mono val-neg">- ${formatMoney(impotsARE)}</span>
                            </div>
                            <div class="line-item total-line">
                                <span>Net ARE</span>
                                <span class="mono">${formatMoney(areNette)}</span>
                            </div>
                        </div>
                `;
        }

        detailsHTML += `
                    </div>
                </div>
            `;

        resultContainer.innerHTML = detailsHTML;
    }

    calculer();
</script>
</body>
</html>
